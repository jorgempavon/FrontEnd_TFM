<div class="main-div  w-100 m-auto">
  <h2>Penalización de intervalo de reserva</h2>
  <app-dynamic-form
    [fields]="fields"
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [form]="form"
    [submitFn]="updatePenalty.bind(this)"
    (formTouched)="deleteMessages()"
    [submitButtonText]="submitButtonText">
  </app-dynamic-form>
</div>
