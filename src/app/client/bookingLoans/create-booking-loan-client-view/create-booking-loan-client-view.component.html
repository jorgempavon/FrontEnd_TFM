<div class="main-div  w-100 m-auto">
    <h2>Crear reserva</h2>

    <div *ngIf="errorMessage" class="alert alert-danger mt-3" role="alert">
        {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="alert alert-success mt-3" role="alert">
        {{ successMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-floating mb-3">
            <input type="date" id="beginDate" class="form-control" formControlName="beginDate" />
            <label  for="beginDate">Fecha inicial de reserva</label>
        </div>

        <div class="form-floating mb-3">
            <button class="btn btn-primary w-100 py-2 mt-4"  type="submit" [disabled]="form.invalid">Crear reserva</button>
        </div>

    </form>

    <div class="row mt-1" style="display: flex; justify-content: center;">
        <button class="btn btn-danger close-modal" (click)="onClose()">Cancelar</button>
    </div>
    
</div>
