<div class="main-login  w-100 m-auto">
  <h2>Iniciar sesión </h2>
  <app-dynamic-form
    [fields]="fields"
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [form]="form"
    [submitFn]="login.bind(this)"
    (formTouched)="deleteMessages()"
    submitButtonText="Iniciar sesión">
  </app-dynamic-form>

    <div class="text-center mt-3">
        <p>¿No tienes cuenta? <a routerLink="/bibliokie/auth/register">Regístrate aquí</a></p>
    </div>

    <p class="mt-5 mb-3 text-body-secondary">© 2025 - Coded by Jorge Muñoz Pavón</p> 
</div>
