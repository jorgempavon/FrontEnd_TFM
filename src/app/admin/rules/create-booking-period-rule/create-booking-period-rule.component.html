<div class="main-div  w-100 m-auto">
  <h2>Crear regla de intervalo</h2>
  <app-dynamic-form
    [fields]="fields"
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [form]="form"
    [submitFn]="createRule.bind(this)"
    (formTouched)="deleteMessages()"
    submitButtonText="Crear regla">
  </app-dynamic-form>

  <div class="row mt-2" style="display: flex; justify-content: center;">
    <button class="btn btn-danger close-modal" (click)="onClose()">Cancelar</button>
  </div>
    
</div>
