<div class="row mt-4 centered-div" >
	<div class="row minimized-83-div">
		<div class="col-3">
			<label for="filterDni">DNI</label>
			<input [(ngModel)]="filterDni" (ngModelChange)="getUsersList()"  type="text" class="form-control" id="filterDni"/>
		</div>
		<div class="col-3">
			<label for="filterEmail">Email</label>
			<input [(ngModel)]="filterEmail" (ngModelChange)="getUsersList()"  type="text" class="form-control" id="filterEmail"/>
		</div>
		<div class="col-3">
			<label for="filterName">Nombre</label>
			<input [(ngModel)]="filterName" (ngModelChange)="getUsersList()"   type="text" class="form-control" id="filterName"/>
		</div>
		
	</div>

	<div class="row mt-4  minimized-83-div">
		<div class="col-2">
			<button (click)="openCreateClientModal()" class="btn btn-primary"><i class="bi bi-person-fill-add"></i> Añadir cliente</button>
		</div>
		<div class="col-3">
			<button (click)="openCreateAdminModal()" class="btn btn-warning"><i class="bi bi-person-fill-add"></i> Añadir administrador</button>
		</div>
		<div class="col-7">
		</div>
	</div>

	<table class="table table-striped minimized-80-div mt-4" *ngIf="pagedListUsers">
		<thead>
			<tr>
				<th scope="col" sortable="id" (sort)="onSort($event)">#</th>
				<th scope="col"  sortable="dni" (sort)="onSort($event)">DNI</th>
				<th scope="col"  sortable="email" (sort)="onSort($event)">Email</th>
				<th scope="col" sortable="name" (sort)="onSort($event)">Nombre</th>
				<th scope="col" sortable="lastName" (sort)="onSort($event)">Apellidos</th>
				<th scope="col" sortable="rol" (sort)="onSort($event)">Rol</th>
				<th scope="col">Acciones</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let user of pagedListUsers">
				<th scope="row">{{ user.id }}</th>
				<td>
					{{ user.dni }}
				</td>
				<td>
					{{ user.email }}
				</td>
				<td>
					{{ user.name }}
				</td>
				<td>
					{{ user.lastName }}
				</td>
				<td>
					{{ user.rol }}
				</td>
				<td>
					<div class="row">
						<div class="col-3">
							<a class="nav-link active iconDiv-size" title="Editar Usuario" [href]="editUserUrl+user.id">
								<i class="bi bi-pencil-square text-primary"></i>
							</a>
						</div>
						<div class="col-3">
							<a class="nav-link active iconDiv-size" title="Listar reservas" href="#">
								<i class="bi bi-book text-success"></i>
							</a>
						</div>
						<div class="col-3">
							<a class="nav-link active iconDiv-size" title="Listar penalizaciones" href="#">
								<i class="bi bi-exclamation-square-fill text-warning"></i>
							</a>
						</div>
						<div class="col-3">
							<a class="nav-link active iconDiv-size" title="Eliminar usuario" href="#" (click)="$event.preventDefault();openDeleteModal(user.id,user.name,user.lastName,user.rol)">
								<i class="bi bi-trash text-danger"></i>
							</a>
						</div>
					</div>
				</td>
			</tr>
			<tr *ngIf="pagedListUsers.length == 0">
				<td colspan="7" class="centered-text">
					No se ha encontrado ningún usuario con los filtros establecidos
				</td>
			</tr>
		</tbody>
	</table>

	<div class="d-flex justify-content-between p-2 minimized-80-div">
		<ngb-pagination *ngIf="pagedListUsers"
			[collectionSize]="collectionSize"
			[(page)]="page"
			[pageSize]="pageSize"
			(pageChange)="refreshUsersPagedList()"
		>
		</ngb-pagination>

		<select class="form-select" style="width: auto" [(ngModel)]="pageSize" (ngModelChange)="refreshUsersPagedList()">
			<option [ngValue]="2">2 items per page</option>
			<option [ngValue]="4">4 items per page</option>
			<option [ngValue]="6">6 items per page</option>
		</select>
	</div>

	<app-dynamic-modal
	[title]="modalTitle"
	[body]="modalBody"
	[buttons]="modalButtons"
	modalId="myModal"
	></app-dynamic-modal>
</div>
